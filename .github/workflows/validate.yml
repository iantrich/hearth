name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install homeassistant==2026.10.2 pytest-homeassistant-custom-component==0.13.373 home-assistant-frontend==20260930.4 mcp==1.28.1 aiohttp_sse==2.2.0 anyio==4.14.2 hassil==3.12.1 home-assistant-intents==2026.10.6 gazetteer-matcher==1.1.0
      - name: Run tests
        run: pytest -p no:anyio
